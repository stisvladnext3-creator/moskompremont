services:
  bot:
    build: .
    image: moskompremont-vpn-bot:0.1.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - bot-data:/data
    tmpfs:
      - /tmp:mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s

volumes:
  bot-data:
