[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moskompremont-vpn-bot"
version = "0.1.0"
description = "Telegram support, 3x-ui reserve links and Xray monitoring from Russia"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22.5,<23",
  "aiohttp>=3.12,<4",
  "httpx[socks]>=0.28,<0.29",
  "cryptography>=44,<51",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
vpn-bot = "vpn_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
