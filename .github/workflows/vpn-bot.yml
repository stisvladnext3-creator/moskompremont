name: VPN bot checks
on:
  push:
    paths: ["vpn-bot/**", ".github/workflows/vpn-bot.yml"]
  pull_request:
    paths: ["vpn-bot/**", ".github/workflows/vpn-bot.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vpn-bot/requirements*.txt
      - run: pip install -r requirements-dev.txt -e .
        working-directory: vpn-bot
      - run: python deploy/install_xray.py "$RUNNER_TEMP/xray"
        working-directory: vpn-bot
      - run: XRAY_TEST_BINARY="$RUNNER_TEMP/xray" pytest -q
        working-directory: vpn-bot
