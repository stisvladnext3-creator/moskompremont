name: Check macOS compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [legacy, modern]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Prepare exact upstream and shared Windows interface
        run: |
          git clone --quiet --depth 1 --branch 7.25.6 https://github.com/2dust/v2rayN.git "$RUNNER_TEMP/upstream"
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = 1883178b5f1e222b6c6db2782e7a3d989b7cc18f
          git -C "$RUNNER_TEMP/upstream" submodule update --init --recursive --depth 1
          python3 macos-client/build/prepare.py "$RUNNER_TEMP/upstream" --version 0.2.0 --flavor ${{ matrix.flavor }} --rid osx-arm64 --probe
      - name: Compile compatibility target
        run: dotnet publish "$RUNNER_TEMP/upstream/v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj" -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -o "$RUNNER_TEMP/publish" > "$RUNNER_TEMP/compile.txt" 2>&1 || { tail -90 "$RUNNER_TEMP/compile.txt"; exit 1; }
