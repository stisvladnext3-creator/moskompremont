name: Build macOS VPN variants
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after all four builds and tests pass
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['macos-client/**', 'desktop-client/**', '.github/workflows/macos-vpn.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        flavor: [legacy, modern]
        rid: [osx-x64, osx-arm64]
        include:
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MOSKOM_VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select temporary build directory
        run: echo "MAC_WORK=$RUNNER_TEMP/moskom-mac" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.flavor == 'legacy' && '1.24.13' || '1.26.9' }}
          cache: false
      - name: Build exact upstream and native platform integration
        run: python3 macos-client/build/build.py --work "$MAC_WORK" --version "$MOSKOM_VERSION" --flavor ${{ matrix.flavor }} --rid ${{ matrix.rid }} > "$RUNNER_TEMP/build.log" 2>&1 || { tail -90 "$RUNNER_TEMP/build.log"; exit 1; }
      - name: Test native Keychain, proxy lifecycle and platform updater
        run: python3 macos-client/build/platform-tests.py "$MAC_WORK" --rid ${{ matrix.rid }} --flavor ${{ matrix.flavor }}
      - name: Verify real TUN process and service routing, including crash cleanup
        run: |
          moskom_target=net10.0
          if [ '${{ matrix.flavor }}' = legacy ]; then moskom_target=net8.0; fi
          dotnet publish desktop-client/tun-tests/Moskom.Tun.Tests.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:MoskomTargetFramework=$moskom_target -p:UpstreamSource="$MAC_WORK/upstream" -o "$MAC_WORK/tun-tests"
          cp "$MAC_WORK/MoskomVPN.app/Contents/MacOS/libMoskomPlatform.dylib" "$MAC_WORK/tun-tests/"
          sudo -n env MOSKOM_TUN_BIN="$MAC_WORK/MoskomVPN.app/Contents/Resources/bin" "$MAC_WORK/tun-tests/Moskom.Tun.Tests" "$MAC_WORK/tun-results"
      - name: Exercise the actual Mac UI and native core configurations
        run: python3 macos-client/build/smoke.py "$MAC_WORK"
      - name: Package DMG and corresponding source
        run: python3 macos-client/build/package.py "$MAC_WORK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.flavor }}-${{ matrix.rid }}
          path: |
            ${{ env.MAC_WORK }}/release/*
            ${{ env.MAC_WORK }}/smoke/*
            ${{ env.MAC_WORK }}/tun-results/*
            ${{ env.MAC_WORK }}/native-audit.json
            ${{ env.MAC_WORK }}/application.log
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 1
  publish:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: payloads
      - name: Validate all four variants and assemble permanent downloads
        run: |
          mkdir release
          find payloads -name '*.dmg' -exec cp {} release/ \;
          find payloads -name '*-source.zip' -exec cp {} release/ \;
          find payloads -name 'preview-*.png' -exec cp {} release/ \;
          find payloads -name 'validation-*.json' -exec cp {} release/ \;
          find payloads -name 'native-audit-*.json' -exec cp {} release/ \;
          test "$(find release -name '*.dmg' | wc -l)" = 4
          cp macos-client/INSTALL-RU.md macos-client/VALIDATION.md release/
          cd release
          sha256sum *.dmg *.zip *.png *.json *.md > SHA256SUMS.txt
      - name: Publish checked release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOSKOM_VERSION: 0.2.${{ github.run_number }}
        run: |
          moskom_tag="moskom-mac-v$MOSKOM_VERSION"
          gh release create "$moskom_tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "МосКомпРемонт VPN · macOS $MOSKOM_VERSION" --notes-file macos-client/RELEASE.md
          gh release upload "$moskom_tag" --repo "$GITHUB_REPOSITORY" release/*
          gh release edit "$moskom_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
